# Compile and package the Stage 2.2 rootless tweak.
# Does not install, inject, or run device/camera tests.
name: Compile MyVCam

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Theos rootless compile and package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dpkg \
            fakeroot \
            git \
            libtinfo5 \
            libtinfo6 \
            perl \
            rsync \
            xz-utils

      - name: Install Theos
        run: |
          set -euo pipefail
          # Pinned to the Theos commit that produced the green ad93430 package.
          theos_sha="dd5c14bb9d91311e221d51b5bfb8c9e5948156db"
          theos="${RUNNER_TEMP}/theos"
          mkdir -p "$theos"
          git -C "$theos" init
          git -C "$theos" remote add origin https://github.com/theos/theos.git
          git -C "$theos" fetch --depth 1 origin "$theos_sha"
          git -C "$theos" checkout --detach FETCH_HEAD
          git -C "$theos" submodule update --init --recursive
          head_sha="$(git -C "$theos" rev-parse HEAD)"
          if [[ "$head_sha" != "$theos_sha" ]]; then
            echo "Theos HEAD ${head_sha} is not ${theos_sha}" >&2
            exit 1
          fi
          echo "Theos ${head_sha}"
          echo "THEOS=${theos}" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset="iOSToolchain-x86_64.tar.xz" ;;
            aarch64|arm64) asset="iOSToolchain-aarch64.tar.xz" ;;
            *)
              echo "unsupported runner arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "${RUNNER_TEMP}/toolchain.tar.xz" \
            "https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/${asset}"
          tar -xJf "${RUNNER_TEMP}/toolchain.tar.xz" -C "$THEOS/toolchain"
          clang="$THEOS/toolchain/linux/iphone/bin/clang"
          if [[ ! -x "$clang" ]]; then
            echo "iOS clang was not installed at $clang" >&2
            find "$THEOS/toolchain" -maxdepth 4 -type d >&2
            exit 1
          fi
          "$clang" --version

      - name: Install ldid
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset="ldid_linux_x86_64" ;;
            aarch64|arm64) asset="ldid_linux_aarch64" ;;
            *)
              echo "unsupported runner arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "${RUNNER_TEMP}/ldid" \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/${asset}"
          sudo install -m 0755 "${RUNNER_TEMP}/ldid" /usr/local/bin/ldid
          command -v ldid
          # Usage text is enough to prove this is Procursus ldid with -Cadhoc.
          ldid 2>&1 | head -n 4 || true

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o "${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz" \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "${RUNNER_TEMP}/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Compile rootless tweak
        run: |
          set -euo pipefail
          make
          merged=".theos/obj/debug/MyVCamTweak.dylib"
          if [[ ! -f "$merged" ]]; then
            echo "make finished without merged ${merged}" >&2
            exit 1
          fi
          printf 'built %s\n' "$merged"
          lipo_bin=""
          for candidate in lipo llvm-lipo; do
            if [[ -x "$THEOS/toolchain/linux/iphone/bin/$candidate" ]]; then
              lipo_bin="$THEOS/toolchain/linux/iphone/bin/$candidate"
              break
            fi
          done
          if [[ -z "$lipo_bin" ]]; then
            echo "toolchain has no lipo" >&2
            exit 1
          fi
          archs="$("$lipo_bin" -info "$merged")"
          printf '%s\n' "$archs"
          if [[ ! "$archs" =~ (^|[^[:alnum:]_])arm64([^[:alnum:]_]|$) ]]; then
            echo "merged dylib is missing arm64: ${archs}" >&2
            exit 1
          fi
          # iPhone 12 loads arm64e when that slice exists. The Linux toolchain's
          # arm64e ABI is incompatible and aborts Camera at the first call.
          if [[ "$archs" =~ (^|[^[:alnum:]_])arm64e([^[:alnum:]_]|$) ]]; then
            echo "merged dylib must not contain arm64e: ${archs}" >&2
            exit 1
          fi
          for class_name in MyVCamManager MediaReader SampleBufferBuilder VideoInjector MyVCamFrame; do
            if ! grep -a -q "$class_name" "$merged"; then
              echo "merged dylib is missing ${class_name}" >&2
              exit 1
            fi
          done
          if ! grep -a -F '[MyVCam C1-A]' "$merged"; then
            echo "merged dylib is missing the C1-A log prefix" >&2
            exit 1
          fi
          if ! grep -a -F '[MyVCam C1-B]' "$merged"; then
            echo "merged dylib is missing the C1-B log prefix" >&2
            exit 1
          fi
          if ! grep -a -F 'copyLatestSampleBufferMatchingOrigin:' "$merged"; then
            echo "merged dylib is missing copyLatestSampleBufferMatchingOrigin:" >&2
            exit 1
          fi
          if ! grep -a -F '[MyVCam C1-C]' "$merged"; then
            echo "merged dylib is missing the C1-C log prefix" >&2
            exit 1
          fi
          if ! grep -a -F '/var/mobile/Documents/MyVCam/test.mp4' "$merged"; then
            echo "merged dylib is missing the C1-C test video path" >&2
            exit 1
          fi
          if ! grep -a -F 'com.myvcam.feed' "$merged"; then
            echo "merged dylib is missing the C1-C feed queue label" >&2
            exit 1
          fi
          if ! grep -a -F 'com.myvcam.match' "$merged"; then
            echo "merged dylib is missing the off-queue match label" >&2
            exit 1
          fi
          if ! grep -a -F 'passthrough warmup finished' "$merged"; then
            echo "merged dylib is missing the passthrough warmup log" >&2
            exit 1
          fi
          if ! grep -a -F 'preview showing imported video' "$merged"; then
            echo "merged dylib is missing the preview-layer log" >&2
            exit 1
          fi
          if ! grep -a -F 'copyLatestSampleBuffer' "$merged"; then
            echo "merged dylib is missing copyLatestSampleBuffer" >&2
            exit 1
          fi
          if ! grep -a -F '/var/mobile/Documents/MyVCam/disable' "$merged"; then
            echo "merged dylib is missing the disable-file path" >&2
            exit 1
          fi
          if ! grep -a -F '/var/jb/var/mobile/Library/MyVCam/test.mp4' "$merged"; then
            echo "merged dylib is missing the rootless mirror path" >&2
            exit 1
          fi
          if ! grep -a -F 'mirror status' "$merged"; then
            echo "merged dylib is missing the mirror status log" >&2
            exit 1
          fi
          if ! grep -a -F 'preview overlay attached' "$merged"; then
            echo "merged dylib is missing the preview overlay log" >&2
            exit 1
          fi
          if ! grep -a -F '[MyVCam 0.2.13]' "$merged"; then
            echo "merged dylib is missing the 0.2.13 diagnostic prefix" >&2
            exit 1
          fi
          if ! grep -a -F '/var/jb/var/mobile/Library/MyVCam/runtime.status' "$merged"; then
            echo "merged dylib is missing runtime.status" >&2
            exit 1
          fi
          if ! grep -a -F '0.2.17' "$merged"; then
            echo "merged dylib is missing the 0.2.17 status version" >&2
            exit 1
          fi
          if ! grep -a -F 'early=1' "$merged"; then
            echo "merged dylib is missing the early load marker" >&2
            exit 1
          fi
          if ! grep -a -F 'jb_errno=' "$merged"; then
            echo "merged dylib is missing jb_errno" >&2
            exit 1
          fi
          if ! grep -a -F '/var/tmp/myvcam-runtime.status' "$merged"; then
            echo "merged dylib is missing the /var/tmp load witness" >&2
            exit 1
          fi
          python3 tools/finalize_load.py --verify "$merged"
          mapfile -t mirrors_built < <(find .theos -path '*.dSYM' -prune -o -name myvcam-mirror -type f -print)
          if [[ ${#mirrors_built[@]} -eq 0 ]]; then
            echo "make finished without myvcam-mirror" >&2
            exit 1
          fi
          python3 tools/finalize_load.py --verify "${mirrors_built[@]}"
          if ! grep -a -F 'proc=' "$merged"; then
            echo "merged dylib is missing the process status field" >&2
            exit 1
          fi
          if ! grep -a -F 'version=%s proc=%s' "$merged"; then
            echo "merged dylib status line is missing version= and proc=" >&2
            exit 1
          fi
          if ! grep -a -F 'com.apple.camera' "$merged"; then
            echo "merged dylib is missing the Camera bundle id" >&2
            exit 1
          fi
          if ! grep -a -F 'preview connection blocked' "$merged"; then
            echo "merged dylib is missing the preview connection blocked log" >&2
            exit 1
          fi
          if ! grep -a -F 'preview detached' "$merged"; then
            echo "merged dylib is missing the preview detached log" >&2
            exit 1
          fi
          if ! grep -a -F 'slot=' "$merged"; then
            echo "merged dylib is missing the placement slot log" >&2
            exit 1
          fi
          if ! grep -a -F 'host found' "$merged"; then
            echo "merged dylib is missing the host found log" >&2
            exit 1
          fi
          if ! grep -a -F 'cover attach' "$merged"; then
            echo "merged dylib is missing the cover attach log" >&2
            exit 1
          fi
          if ! grep -a -F 'first frame to cover' "$merged"; then
            echo "merged dylib is missing the first frame to cover log" >&2
            exit 1
          fi
          if ! grep -a -F 'timer ticks' "$merged"; then
            echo "merged dylib is missing the timer ticks log" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp -v "$merged" artifacts/MyVCamTweak.dylib

      - name: Package rootless .deb
        run: |
          set -euo pipefail
          make package
          mapfile -t debs < <(
            find . \
              -path './.git' -prune -o \
              -path './artifacts' -prune -o \
              -name '*.deb' -print
          )
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "make package finished without .deb" >&2
            find . -path './.git' -prune -o -type f -print | head -200 >&2
            exit 1
          fi
          printf 'packaged %s\n' "${debs[@]}"
          mkdir -p artifacts
          cp -v "${debs[@]}" artifacts/
          shopt -s nullglob
          packaged=(artifacts/*.deb)
          if [[ ${#packaged[@]} -ne 1 ]]; then
            echo "expected one packaged deb, found ${#packaged[@]}" >&2
            exit 1
          fi
          dpkg-deb -I "${packaged[0]}"
          dpkg-deb -c "${packaged[0]}"
          control_text="$(dpkg-deb -I "${packaged[0]}" control)"
          printf '%s\n' "$control_text"
          if ! grep -q '^Package: com.myvcam.tweak$' <<<"$control_text"; then
            echo "deb Package is not com.myvcam.tweak" >&2
            exit 1
          fi
          if ! grep -q '^Architecture: iphoneos-arm64$' <<<"$control_text"; then
            echo "deb Architecture is not iphoneos-arm64" >&2
            exit 1
          fi
          if ! grep -q '^Version: 0.2.17' <<<"$control_text"; then
            echo "deb Version does not start at 0.2.17" >&2
            exit 1
          fi
          deb_base="$(basename "${packaged[0]}")"
          if [[ "$deb_base" != "com.myvcam.tweak_0.2.17-1+debug_iphoneos-arm64.deb" ]]; then
            echo "unexpected deb filename: ${deb_base}" >&2
            exit 1
          fi
          sha256sum "${packaged[0]}"
          extracted="${RUNNER_TEMP}/myvcam-deb"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          dpkg-deb -x "${packaged[0]}" "$extracted"
          mapfile -t dylibs < <(find "$extracted" -name 'MyVCamTweak.dylib' -print)
          mapfile -t plists < <(find "$extracted" -name 'MyVCamTweak.plist' -print)
          if [[ ${#dylibs[@]} -ne 1 || ${#plists[@]} -ne 1 ]]; then
            echo "deb layout is missing the tweak dylib or plist" >&2
            exit 1
          fi
          if ! grep -q '<string>com.apple.camera</string>' "${plists[0]}"; then
            echo "packaged filter is not com.apple.camera" >&2
            exit 1
          fi
          if ! grep -q '<string>com.apple.springboard</string>' "${plists[0]}"; then
            echo "packaged filter is missing com.apple.springboard" >&2
            exit 1
          fi
          if ! grep -q '<key>Executables</key>' "${plists[0]}"; then
            echo "packaged filter is missing Executables" >&2
            exit 1
          fi
          if ! grep -q '<string>Camera</string>' "${plists[0]}"; then
            echo "packaged filter is missing executable Camera" >&2
            exit 1
          fi
          if ! grep -q '<string>SpringBoard</string>' "${plists[0]}"; then
            echo "packaged filter is missing executable SpringBoard" >&2
            exit 1
          fi
          if ! grep -q '<string>com.apple.Preferences</string>' "${plists[0]}"; then
            echo "packaged filter is missing com.apple.Preferences" >&2
            exit 1
          fi
          if ! grep -q '<string>Preferences</string>' "${plists[0]}"; then
            echo "packaged filter is missing executable Preferences" >&2
            exit 1
          fi
          if ! grep -q '<key>Mode</key>' "${plists[0]}" || ! grep -q '<string>Any</string>' "${plists[0]}"; then
            echo "packaged filter is missing Mode Any" >&2
            exit 1
          fi
          if grep -q '<!--' "${plists[0]}"; then
            echo "packaged filter contains an XML comment; ElleKit drops the tweak if the plist fails to parse" >&2
            exit 1
          fi
          if grep -q 'com.myvcam.stage21.placeholder' "${plists[0]}"; then
            echo "packaged filter still contains the placeholder bundle" >&2
            exit 1
          fi
          if grep -E '<string>[^<]*mediaserverd[^<]*</string>' "${plists[0]}"; then
            echo "packaged filter names mediaserverd" >&2
            exit 1
          fi
          control_dir="${RUNNER_TEMP}/myvcam-deb-control"
          rm -rf "$control_dir"
          mkdir -p "$control_dir"
          dpkg-deb -e "${packaged[0]}" "$control_dir"
          if [[ ! -f layout/DEBIAN/postinst ]]; then
            echo "source postinst is missing" >&2
            exit 1
          fi
          if [[ ! -f "$control_dir/postinst" ]]; then
            echo "deb is missing postinst" >&2
            exit 1
          fi
          if [[ ! -f "$control_dir/prerm" ]]; then
            echo "deb is missing prerm" >&2
            exit 1
          fi
          sh -n "$control_dir/postinst"
          sh -n "$control_dir/prerm"
          if ! cmp -s layout/DEBIAN/postinst "$control_dir/postinst"; then
            echo "packaged postinst does not match layout/DEBIAN/postinst" >&2
            exit 1
          fi
          if ! cmp -s layout/DEBIAN/prerm "$control_dir/prerm"; then
            echo "packaged prerm does not match layout/DEBIAN/prerm" >&2
            exit 1
          fi
          if ! grep -F 'version=0.2.17' "$control_dir/postinst"; then
            echo "postinst is missing version=0.2.17" >&2
            exit 1
          fi
          if ! grep -F 'substrate=' "$control_dir/postinst"; then
            echo "postinst is missing substrate=" >&2
            exit 1
          fi
          if ! grep -F 'framework=' "$control_dir/postinst"; then
            echo "postinst is missing framework=" >&2
            exit 1
          fi
          if ! grep -F 'tweak_inject=' "$control_dir/postinst"; then
            echo "postinst is missing tweak_inject=" >&2
            exit 1
          fi
          if ! grep -F 'dynamic_libs=' "$control_dir/postinst"; then
            echo "postinst is missing dynamic_libs=" >&2
            exit 1
          fi
          if ! grep -F 'timestamp=' "$control_dir/postinst"; then
            echo "postinst is missing timestamp=" >&2
            exit 1
          fi
          if ! grep -F 'exit=0' "$control_dir/postinst"; then
            echo "postinst is missing exit=0" >&2
            exit 1
          fi
          if ! grep -F '/var/jb/var/mobile/Library/MyVCam/package.installed' "$control_dir/postinst"; then
            echo "postinst is missing the package.installed path" >&2
            exit 1
          fi
          if ! grep -F 'runtime.status' "$control_dir/postinst"; then
            echo "postinst no longer prepares runtime.status" >&2
            exit 1
          fi
          if grep -F '/var/jb/var/mobile/Library/MyVCam/package.installed' "$control_dir/postinst" | grep -F 'runtime.status'; then
            echo "postinst names package.installed and runtime.status on the same line" >&2
            exit 1
          fi
          if ! grep -F '/var/jb/var/mobile/Library/MyVCam/package.installed' "$control_dir/prerm"; then
            echo "prerm does not remove package.installed" >&2
            exit 1
          fi
          if ! grep -F '/var/tmp/myvcam-runtime.status' "$control_dir/prerm"; then
            echo "prerm does not remove the /var/tmp load witness" >&2
            exit 1
          fi
          if find "$extracted" -name 'package.installed' -print | grep -q .; then
            echo "deb data archive must not ship package.installed; postinst creates it" >&2
            exit 1
          fi
          mapfile -t mirrors < <(find "$extracted" -name 'myvcam-mirror' -type f -print)
          mapfile -t mirror_plists < <(find "$extracted" -name 'com.myvcam.mirror.plist' -print)
          if [[ ${#mirrors[@]} -ne 1 || ${#mirror_plists[@]} -ne 1 ]]; then
            echo "deb layout is missing myvcam-mirror or its launch daemon" >&2
            exit 1
          fi
          python3 tools/finalize_load.py --verify "${dylibs[0]}" "${mirrors[0]}"
          lipo_bin=""
          for candidate in lipo llvm-lipo; do
            if [[ -x "$THEOS/toolchain/linux/iphone/bin/$candidate" ]]; then
              lipo_bin="$THEOS/toolchain/linux/iphone/bin/$candidate"
              break
            fi
          done
          if [[ -z "$lipo_bin" ]]; then
            echo "toolchain has no lipo" >&2
            exit 1
          fi
          mirror_archs="$("$lipo_bin" -info "${mirrors[0]}")"
          printf '%s\n' "$mirror_archs"
          if [[ ! "$mirror_archs" =~ (^|[^[:alnum:]_])arm64([^[:alnum:]_]|$) ]]; then
            echo "myvcam-mirror is missing arm64: ${mirror_archs}" >&2
            exit 1
          fi
          if [[ "$mirror_archs" =~ (^|[^[:alnum:]_])arm64e([^[:alnum:]_]|$) ]]; then
            echo "myvcam-mirror must not contain arm64e: ${mirror_archs}" >&2
            exit 1
          fi
          if ! grep -a -F 'mirror.status' "${mirrors[0]}"; then
            echo "myvcam-mirror is missing mirror.status" >&2
            exit 1
          fi
          if ! grep -a -F -- '--watch' "${mirrors[0]}"; then
            echo "myvcam-mirror is missing --watch" >&2
            exit 1
          fi
          if ! grep -a -F 'com.apple.camera' "${mirrors[0]}"; then
            echo "myvcam-mirror is missing the Camera container identifier" >&2
            exit 1
          fi
          if ! grep -a -F '[MyVCam 0.2.8]' "${mirrors[0]}"; then
            echo "myvcam-mirror is missing the 0.2.8 diagnostic prefix" >&2
            exit 1
          fi
          if ! grep -a -F 'runtime.status' "${mirrors[0]}"; then
            echo "myvcam-mirror is missing runtime.status" >&2
            exit 1
          fi
          if ! grep -a -q '<string>--watch</string>' "${mirror_plists[0]}"; then
            echo "launch daemon is not KeepAlive --watch" >&2
            exit 1
          fi
          if ! grep -a -q '<key>KeepAlive</key>' "${mirror_plists[0]}"; then
            echo "launch daemon is missing KeepAlive" >&2
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyVCam-deb
          path: artifacts/*.deb
          if-no-files-found: error

      - name: Upload .dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyVCam-dylib
          path: artifacts/*.dylib
          if-no-files-found: error
